<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/register.css">
  <title>Daftar - FITRASHOP</title>
</head>
<body>
  <main class="halaman">

    <!-- ===== PANEL HITAM: logo dan slogan ===== -->
    <section class="panel-merek">
      <a href="index.html" class="logo">FITRASHOP<span>.</span></a>

      <div class="slogan">
        <h2>Tampil <em>Percaya Diri</em><br>Setiap Hari</h2>
        <p>Koleksi butik pilihan untuk gaya Anda.</p>
      </div>

      <small>&copy; 2026 FITRASHOP</small>
    </section>

    <!-- ===== PANEL PUTIH: form register ===== -->
    <section class="panel-form">
      <div class="kotak-form">
        <h1>Buat Akun</h1>
        <p class="deskripsi">Daftar gratis dan mulai belanja di FITRASHOP.</p>

        <form id="form-register" novalidate>
          <div class="field">
            <label for="nama">Nama lengkap</label>
            <input type="text" id="nama" placeholder="Nama Anda">
            <p class="pesan-error"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="nama@email.com">
            <p class="pesan-error"></p>
          </div>

          <div class="field">
            <label for="sandi">Kata sandi</label>
            <div class="input-sandi">
              <input type="password" id="sandi" placeholder="Minimal 8 karakter">
              <button type="button" class="toggle-sandi">Lihat</button>
            </div>
            <p class="pesan-error"></p>
          </div>

          <div class="field">
            <label for="konfirmasi">Ulangi kata sandi</label>
            <div class="input-sandi">
              <input type="password" id="konfirmasi" placeholder="Ulangi kata sandi">
              <button type="button" class="toggle-sandi">Lihat</button>
            </div>
            <p class="pesan-error"></p>
          </div>

          <div class="field">
            <label class="cek">
              <input type="checkbox" id="setuju">
              <span>Saya menyetujui <a href="#" class="tautan">Syarat &amp; Ketentuan</a></span>
            </label>
            <p class="pesan-error"></p>
          </div>

          <button type="submit" class="tombol">Daftar</button>
        </form>

        <p class="footer-form">Sudah punya akun? <a href="login.html" class="tautan">Masuk</a></p>
      </div>
    </section>

  </main>
  <script src="js/fungsi-akun.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
